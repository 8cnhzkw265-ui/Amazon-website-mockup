<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Checkout</title>

    <!-- This code is needed for responsive design to work.
      (Responsive design = make the website look good on
      smaller screen sizes like a phone or a tablet). -->
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Load a font called Roboto from Google Fonts. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- Here are the CSS files for this page. -->
    <link rel="stylesheet" href="general.css">
    <link rel="stylesheet" href="checkout-header.css">
    <link rel="stylesheet" href="checkout.css">
  </head>
  <body>
    <div class="checkout-header">
      <div class="header-content">
        <div class="checkout-header-left-section">
          <a href="index.html">
            <img class="amazon-logo" src="amazon-logo.svg">
            <img class="amazon-mobile-logo" src="amazon-mobile-logo.svg">
          </a>
        </div>

        <div class="checkout-header-middle-section">
          Checkout (<a class="return-to-home-link"
            href="index.html"><span class="checkout-item-count">0</span> items</a>)
        </div>

        <div class="checkout-header-right-section">
          <a class="return-to-home-link" href="order.html">Orders</a>
        </div>
      </div>
    </div>

    <div class="main">
      <div class="page-title">Review your order</div>

      <div class="checkout-grid">
        <div class="order-summary" id="order-summary">
        </div>

        <div class="payment-summary" id="payment-summary">
        </div>
      </div>
    </div>

    <script src="cart.js"></script>
    <script src="product.js"></script>
    <script src="checkout.js"></script>
  </body>
</html>
