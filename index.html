<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Amazon Project</title>

    <!-- This code is needed for responsive design to work.
      (Responsive design = make the website look good on
      smaller screen sizes like a phone or a tablet). -->
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Load a font called Roboto from Google Fonts. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- Here are the CSS files for this page. -->
    <link rel="stylesheet" href="amazon.css">
    <link rel="stylesheet" href="amazon-header.css">
    <link rel="stylesheet" href="general.css">
  </head>
  <body>
    <div class="amazon-header">
      <div class="amazon-header-left-section">
        <a href="index.html" class="header-link">
          <img class="amazon-logo"
            src="amazon-logo-white.svg">
          <img class="amazon-mobile-logo"
            src="amazon-mobile-logo-white.svg">
        </a>
      </div>

      <div class="amazon-header-middle-section">
        <input class="search-bar" type="search" placeholder="Search products" aria-label="Search products">

        <button class="search-button">
          <img class="search-icon" src="search-icon.svg">
        </button>
      </div>

      <div class="amazon-header-right-section">
        <a class="orders-link header-link" href="order.html">
          <span class="returns-text">Returns</span>
          <span class="orders-text">& Orders</span>
        </a>

        <a class="cart-link header-link" href="checkout.html">
          <img class="cart-icon" src="cart-icon.svg">
          <div class="cart-quantity js-cart-quantity">0</div>
          <div class="cart-text">Cart</div>
        </a>
      </div>
    </div>

    <div class="main">
      <section class="add-product-panel" aria-labelledby="add-product-title">
        <div>
          <h1 id="add-product-title">Add your own product</h1>
          <p>Create a product card for this browser and add it to your catalog.</p>
        </div>
        <form class="add-product-form" id="add-product-form">
          <label>
            Product name
            <input name="name" type="text" maxlength="80" required placeholder="e.g. Travel mug">
          </label>
          <label>
            Price (USD)
            <input name="price" type="number" min="0.01" max="1000000" step="0.01" required placeholder="19.99">
          </label>
          <label>
            Image URL
            <input name="image" type="url" placeholder="https://example.com/image.jpg">
          </label>
          <label>
            Keywords
            <input name="keywords" type="text" maxlength="120" placeholder="kitchen, travel">
          </label>
          <button class="button-primary" type="submit">Add product</button>
        </form>
      </section>
      <div class="products-grid js-products-grid">
      </div>
    </div>

    <script src="cart.js"></script>
    <script src="product.js"></script>
    <script src="amazon.js"></script>
  </body>
</html>
